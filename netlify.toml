[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["config.js", "cotizador.js"]

[[redirects]]
  from = "/api/crear-pago"
  to = "/.netlify/functions/crear-pago"
  status = 200

[[redirects]]
  from = "/api/fechas"
  to = "/.netlify/functions/fechas"
  status = 200

[[redirects]]
  from = "/api/consulta"
  to = "/.netlify/functions/consulta"
  status = 200

[[redirects]]
  from = "/api/mp-webhook"
  to = "/.netlify/functions/mp-webhook"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
